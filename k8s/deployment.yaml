apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-resume-ats-deployment
  labels:
    app: ai-resume-ats
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-resume-ats
  template:
    metadata:
      labels:
        app: ai-resume-ats
    spec:
      containers:
        - name: ai-resume-ats
          image: swapnilsupe01/ai-resume-ats:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
