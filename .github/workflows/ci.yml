name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: Lint & Security Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Lint & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8 Code Quality
        run: |
          flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Bandit DevSecOps Security Scan
        run: |
          bandit -r backend/app/ -ll -i || true

  test-ml-pipeline:
    name: ML Pipeline & Scoring Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run End-to-End ML & Verification Tests
        env:
          PYTHONPATH: backend:backend/app
        run: |
          python backend/test.py

  docker-build:
    name: Docker Build & Health Check
    needs: [lint-and-security, test-ml-pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ai-resume-ats:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker Smoke Test
        run: |
          docker run -d --name ats-test-app -p 8000:8000 ai-resume-ats:latest
          sleep 12
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/health || (docker logs ats-test-app && exit 1)
          docker stop ats-test-app
