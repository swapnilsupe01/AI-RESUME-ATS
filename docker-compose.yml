version: '3.8'

services:
  ai-resume-ats:
    build:
      context: .
      dockerfile: Dockerfile
    image: swapnilsupe01/ai-resume-ats:latest
    container_name: ai-resume-ats-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      # Mount cache for Sentence-Transformers models to avoid re-downloading
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  model_cache:
    driver: local
